<template>
    <lightning-card title="Add Products to Purchase Order" icon-name="standard:product">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <div class="slds-p-around_medium">
            <lightning-input label="Purchase Order Name" value={poName} required disabled></lightning-input>
            <lightning-input label="Account" value={selectedAccountName} required disabled></lightning-input>
            <lightning-input label="Supplier Distributor" value={selectedSupplierName} required disabled></lightning-input>
            <lightning-input label="Pricebook Mapping" value={selectedPriceBook} required disabled class="slds-m-bottom_medium"></lightning-input>

            <template if:true={selectedProducts.length}>
                <h3 class="slds-section__title slds-theme_shade slds-p-around_small slds-m-bottom_small">Products to Add</h3>
                <div class="table-scroll-wrapper slds-m-bottom_medium" style="overflow-x: auto;">
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th style="width: 3rem;">#</th>
                                <th>Product</th>
                                <th>Unit Price</th>
                                <th>Quantity</th>
                                <th style="width: 3rem;">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={selectedProducts} for:item="item" for:index="index">
                                <tr key={item.productId}>
                                    <td>{item.serial}</td>
                                    <td>{item.productName}</td>
                                    <td>
                                        <lightning-formatted-number value={item.unitPrice} format-style="currency" currency-code="INR"></lightning-formatted-number>
                                    </td>
                                    <td>
                                        <lightning-input type="number" label="Quantity" variant="label-hidden"
                                            value={item.minOrderQty} data-index={index} onchange={handleQuantityChange}
                                            min="0" step="1">
                                        </lightning-input>
                                    </td>
                                    <td>
                                        <lightning-button-icon icon-name="utility:delete" alternative-text="Delete"
                                            title="Delete" onclick={handleDeleteProduct} data-id={item.productId}>
                                        </lightning-button-icon>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <h3 class="slds-section__title slds-theme_shade slds-p-around_small slds-m-vertical_small">Find and Select Products</h3>
            <lightning-combobox
                label="Select Brand"
                value={selectedBrand}
                options={brandOptions}
                onchange={handleBrandChange}
                placeholder="-- Select a brand first --"
                class="slds-m-bottom_small">
            </lightning-combobox>

            <template if:true={isBrandSelected}>
                <div style="position:relative;">
                    <template if:true={isLoadingProducts}>
                        <div class="spinner-overlay">
                            <lightning-spinner alternative-text="Loading Products" size="medium"></lightning-spinner>
                        </div>
                    </template>

                    <div class="slds-form-element slds-m-bottom_medium">
                            <div class="slds-form-element__control">
                                <input type="search" class="slds-input slds-size_1-of-2" placeholder="Search products by name..."
                                    onkeyup={handleSearch}
                                    style="border: none; border-bottom: 1px solid grey; border-radius: 0; box-shadow: none;" />
                            </div>
                        </div>

                    <div class="datatable-container" style="max-height: 300px; overflow-y: auto;">
                        <lightning-datatable
                            key-field="id"
                            data={productOptions}
                            columns={columns}
                            onrowselection={handleRowSelection}
                            selected-rows={selectedProductIdsForDataTable}>
                        </lightning-datatable>
                    </div>
                </div>
            </template>
        </div>

        <div slot="footer" class="slds-p-horizontal_medium">
             <lightning-button
                variant="neutral"
                label="Add Selected Products"
                icon-name="utility:add"
                onclick={handleAddSelectedProducts}
                disabled={isAddProductsDisabled}
                class="slds-m-right_small">
            </lightning-button>
            <lightning-button
                variant="brand"
                label="Add All to Purchase Order"
                onclick={handleAddProductsToPO}
                disabled={isSubmitDisabled}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
