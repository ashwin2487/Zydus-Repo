<template>
    <lightning-modal-header label="Enter Courier Details"></lightning-modal-header>

    <lightning-modal-body>
        <p class="slds-p-bottom_small">
            Please provide the following details and click '{DCLable}' to generate the Delivery Challan.
        </p>

        <div class="slds-grid slds-gutters slds-wrap">
            <div class="slds-col slds-size_1-of-2">
                <lightning-input 
                    type="text" 
                    label="Courier Name" 
                    value={courierName} 
                    onchange={handleCourierNameChange}
                    required>
                </lightning-input>
            </div>

            <div class="slds-col slds-size_1-of-2">
                <lightning-input 
                    type="text" 
                    label="Courier Docket No." 
                    value={courierDocket} 
                    onchange={handleCourierDocketChange}
                    required>
                </lightning-input>
            </div>

            <div class="slds-col slds-size_1-of-2">
                <lightning-input 
                    type="date" 
                    label="Courier Date" 
                    value={courierDate} 
                    onchange={handleCourierDateChange}
                    min={minDate}
                    required>
                </lightning-input>
            </div>
        </div>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button 
            variant="neutral" 
            label="Cancel" 
            onclick={closeCreateDCModal}>
        </lightning-button>

        <lightning-button 
            variant="brand" 
            label={DCLable} 
            onclick={createDC} 
            disabled={disableCreateDCBtn}
            class="slds-m-left_x-small">
        </lightning-button>
    </lightning-modal-footer>
</template>
