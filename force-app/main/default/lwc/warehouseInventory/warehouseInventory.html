<template>
    <lightning-card title="Warehouse Inventory" icon-name="utility:database">

        <div slot="actions">
            <lightning-combobox label="Select Warehouse" value={selectedWarehouseId} options={warehouseOptions}
                onchange={handleWarehouseChange} style="width: 300px;">
            </lightning-combobox>
        </div>

        <div class="slds-p-around_medium">

            <template if:true={isLoading}>
                <div class="slds-is-relative" style="height: 10rem;">
                    <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>
                <template if:true={isWarehouseSelected}>

                    <template if:false={showReverseTable}>
                        <div class="slds-grid slds-grid_vertical-align-end slds-m-bottom_medium">
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5">
                                <lightning-combobox label="Filter by Status" value={selectedStatus}
                                    options={statusOptions} onchange={handleStatusOptionsChange}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-text-align_right">
                                <template if:true={showReverseSOBtn}>
                                    <lightning-button label="Reverse SO"
                                        onclick={handleReverseClick}></lightning-button>
                                </template>
                            </div>
                        </div>

                        <template if:true={tableData.length}>
                            <lightning-datatable key-field="serialNumber" data={tableData} columns={columns}
                                column-widths-mode="auto" hide-checkbox-column="true">
                            </lightning-datatable>
                        </template>
                        <template if:false={tableData.length}>
                            <lightning-datatable key-field="serialNumber" data={tableDataForInTransit}
                                columns={columnsForInTransit} column-widths-mode="auto" hide-checkbox-column="true">
                            </lightning-datatable>
                        </template>

                        <template if:false={hasData}>
                            <div class="slds-align_absolute-center slds-text-color_weak slds-m-vertical_large">
                                <p>No inventory data available for the selected status.</p>
                            </div>
                        </template>
                    </template>

                    <template if:true={showReverseTable}>
                        <div class="slds-grid slds-m-bottom_medium">
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5">
                                <lightning-combobox label="Filter by Condition" value={selectedCondition}
                                    options={conditionOptions} onchange={handleConditionChange}>
                                </lightning-combobox>
                            </div>
                        </div>

                        <template if:true={reverseSOTableData.length}>
                            <lightning-datatable key-field="Id" data={reverseSOTableData} columns={wpliColumns}
                                onrowselection={handleRowSelection}>
                            </lightning-datatable>
                        </template>

                        <template if:false={reverseSOTableData.length}>
                            <div class="slds-align_absolute-center slds-text-color_weak slds-m-vertical_large">
                                <p>No data available for the selected condition.</p>
                            </div>
                        </template>

                        <div class="slds-border_top slds-p-top_medium slds-m-top_medium slds-text-align_right">
                            <lightning-button label="Back" onclick={handleBackClick} class="slds-m-right_small">
                            </lightning-button>
                            <lightning-button variant="brand" label="Proceed" onclick={handleProceed}
                                disabled={isProceedDisabled}>
                            </lightning-button>
                        </div>
                    </template>
                </template>

                <template if:false={isWarehouseSelected}>
                    <div class="slds-align_absolute-center slds-text-color_weak" style="height: 10rem;">
                        <p>Please select a warehouse to view inventory.</p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
