<template>
    <lightning-card title="Create Purchase Order" icon-name="standard:orders"  class="custom-card">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
        <div class="slds-p-around_medium">
            <!-- Basic PO Info -->
            <lightning-input label="Account" value={selectedAccountName} required disabled></lightning-input>

            <lightning-input label="Supplier Distributor" value={selectedSupplierName} required
                disabled></lightning-input>


            <lightning-input label="Pricebook Mapping" value={selectedPriceBook} required disabled
                class="slds-m-bottom_medium"></lightning-input>

            <lightning-input type="checkbox" label="Would you like to approve this Purchase Order now?"
                value={approvePurchaseOrder} onchange={handleApproveChange} class="slds-m-bottom_medium"
                message-when-help-text="Once approved, you won’t be able to edit this Purchase Order."
                field-level-help="Once approved, you won’t be able to edit this Purchase Order."></lightning-input>

            <template if:true={selectedProducts.length}>
                <div class="table-scroll-wrapper slds-m-around_medium" style="overflow-x: auto;">
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th>#</th>
                                <th>Product</th>
                                <th>Unit Price</th>
                                <th>MRP</th>
                                <th>Quantity</th>
                                <th>Bill Discount</th>
                                <th>Credit Note</th>
                                <th>Brand Pricing</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={selectedProducts} for:item="item" for:index="index">
                                <tr key={item.productId}>
                                    <td>{item.serial}</td>
                                    <td>{item.productName}</td>
                                    <td>{item.unitPrice}</td>
                                    <td>{item.mrp}</td>
                                    <td>
                                        <lightning-input type="number" label="Quantity" variant="label-hidden"
                                            value={item.minOrderQty} data-index={index} onchange={handleQuantityChange}>
                                        </lightning-input>
                                    </td>
                                    <td>{item.billDiscount}</td>
                                    <td>{item.creditNote}</td>
                                    <td>
                                        <lightning-input type="checkbox" checked={item.useBrandPricing} disabled>
                                        </lightning-input>
                                    </td>
                                    <td>
                                        <lightning-button-icon icon-name="utility:delete" alternative-text="Delete"
                                            title="Delete" onclick={handleDeleteProduct} data-id={item.productId}>
                                        </lightning-button-icon>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <lightning-combobox label="Select Brand" value={selectedBrand} options={brandOptions}
                onchange={handleBrandChange} placeholder="Select a brand"
                class="slds-m-bottom_medium"></lightning-combobox>

            <div class="slds-m-around_medium">

                <!-- Spinner overlay -->
                <template if:true={isLoadingProducts}>
                    <div class="spinner-overlay"
                        style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.6); z-index:10;">
                        <lightning-spinner alternative-text="Loading Products" size="medium"></lightning-spinner>
                    </div>
                </template>

                <!-- Show datatable when there are rows, apply scrollable height -->
                <template if:true={hasData}>
                    <div class="slds-form-element slds-m-bottom_medium">
                        <div class="slds-form-element__control">
                            <input type="search" class="slds-input slds-size_1-of-4"
                                placeholder="Search products by name..." onkeyup={handleSearch}
                                style="border: none; border-bottom: 1px solid grey; border-radius: 0; box-shadow: none;" />
                        </div>
                    </div>
                    <div class="slds-is-relative" style="max-height: 400px; overflow: auto; min-height: 150px;">
                        <lightning-datatable key-field="id" data={productOptions} columns={columns}
                            onrowselection={handleRowSelection} selected-rows={selectedProductIds}>
                        </lightning-datatable>
                    </div>
                </template>

                <!-- Show custom empty message in table-like area with natural height -->
                <template if:false={hasData}>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered"
                        style="border-radius: 0.25rem;">
                        <thead>
                            <tr>
                                <template for:each={columns} for:item="col">
                                    <th key={col.fieldName}>
                                        <div class="slds-truncate" title={col.label}>{col.label}</div>
                                    </th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan={columnCount} class="slds-text-align_center slds-text-color_weak">
                                    No products available
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </template>

            </div>
        </div>
        <div class="slds-docked-form-footer slds-align_absolute-center slds-p-certical_medium">
            <lightning-button variant="neutral" label="Add Product" icon-name="utility:add" onclick={handleAddProduct}
                class="slds-m-right_small">
            </lightning-button>

            <lightning-button variant="brand" label={manualPOLable} onclick={handleCreateManualPO}
                disabled={disableCreatePOBtnGetter}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
