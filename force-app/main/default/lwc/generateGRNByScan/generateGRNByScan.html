<template>
    <div class="slds-p-around_medium slds-box slds-theme_default" style="background-color: #f3f4f6;">
        <div class="slds-grid slds-grid_vertical">
            <div class="slds-p-around_medium slds-theme_shade slds-radius_medium"
                style="background-color: white; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);">
                <h2 class="slds-text-heading_medium slds-text-color_default slds-m-bottom_medium">
                    <lightning-icon icon-name="utility:settings" size="small"
                        class="slds-m-right_small"></lightning-icon>
                    Generate GRN for Delivery Challan: {dcName}
                </h2>

                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-1 slds-p-bottom_medium">
                        <div class="slds-form-element">
                            <label class="slds-form-element__label slds-m-bottom_x-small">1. Status</label>
                            <div class="slds-form-element__control">
                                <div class="slds-button-group" role="group">
                                    <button class={acceptButtonClass} onclick={handleStatusChange}
                                        data-status="Accepted">Accept</button>
                                    <button class={rejectButtonClass} onclick={handleStatusChange}
                                        data-status="Rejected">Reject</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <template if:true={isRejectStatus}>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                            <lightning-combobox name="rejectionReason" label="2. Rejection Reason"
                                value={rejectionReason} placeholder="Select a reason..."
                                options={rejectionReasonOptions} onchange={handleReasonChange}
                                required={isRejectStatus}>
                            </lightning-combobox>
                        </div>
                    </template>

                    <template if:true={isRejectionCommentRequired}>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                            <lightning-textarea rows="2" type="text" name="rejectionComment"
                                label="3. Rejection Comment" value={rejectionComment} placeholder="Type a reason..."
                                onchange={handleChangeRejectionCommentChange} required={isRejectionCommentRequired}>
                            </lightning-textarea>
                        </div>
                    </template>

                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                        <lightning-combobox name="warehouse" label={warehouseLabel} value={warehouse} 
                            placeholder="Select warehouse..." options={warehouseOptions}
                            onchange={handleWarehouseChange} disabled={showWarehouse} required>
                        </lightning-combobox>
                    </div>
                </div>

                <div>
                    <div
                        class="slds-align-middle slds-m-bottom_x-small slds-grid slds-wrap slds-grid_vertical-align-center">
                        <h3 class="slds-text-heading_small slds-m-right_x-small">Scan Product</h3>
                        <lightning-helptext
                            content="Please scan or manually enter the serial number and press Enter"></lightning-helptext>
                    </div>
                    <div class="slds-form-element">
                        <div class="slds-form-element__control" style="position: relative;">
                            <input type="text" class="slds-input scan-input" data-id="inputField"
                                placeholder={bulkScanPlaceholder} oninput={handleScan}
                                disabled={isScanDisabled} />
                            <div
                                style="position: absolute; top: 50%; right: 1rem; transform: translateY(-50%); pointer-events: none;">
                                <lightning-icon icon-name="utility:scan" size="small"
                                    alternative-text="Scan"></lightning-icon>
                            </div>
                        </div>
                    </div>
                    <template if:true={isScanDisabled}>
                        <div class="slds-text-color_error slds-m-top_xx-small">Please select a warehouse to begin
                            scanning.</div>
                    </template>
                </div>
            </div>
            <div class="slds-m-top_medium">
                <div class="slds-p-horizontal_medium slds-p-vertical_small slds-theme_shade slds-grid slds-grid_align-spread slds-radius_medium"
                    style="border: 1px solid #e5e7eb;">
                    <h3 class="slds-text-heading_small">Scanned Products</h3>
                    <div class="slds-text-body_strong slds-text-color_default">
                        Total Scanned: <span class="slds-badge slds-theme_success">{scannedItems.length} /
                            {lineItems.length}</span>
                    </div>
                </div>
                <template if:false={hasScannedItems}>
                    <div class="slds-p-around_large slds-text-align_center slds-theme_default slds-m-top_small slds-radius_medium"
                        style="border: 1px dashed #d8dde6;">
                        <lightning-icon icon-name="utility:scan_card" size="large"
                            alternative-text="Scan Icon"></lightning-icon>
                        <p class="slds-text-heading_small slds-m-top_medium">Ready to Scan</p>
                        <p class="slds-text-color_weak">Scanned products will appear here.</p>
                    </div>
                </template>

                <template if:true={hasScannedItems}>
                    <div class="slds-m-top_small slds-box slds-box_border">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col">
                                        <div class="slds-truncate" title="Product">Product</div>
                                    </th>

                                    <th scope="col">
                                        <div class="slds-truncate" title="Serial Number">Serial Number</div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate" title="Warehouse">Warehouse</div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate" title="Expiry Date">Expiry Date</div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate" title="Batch Number">Batch Number</div>
                                    </th>

                                    <th scope="col" style="width: 50px;">
                                        <div class="slds-truncate" title="Status">Status</div>
                                    </th>
                                    <th scope="col" style="width: 150px;">
                                        <div class="slds-truncate" title="Reason">Reason</div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={scannedItems} for:item="item">
                                    <tr key={item.serialNumber} class="slds-hint-parent">
                                        <td scope="row">
                                            <div class="slds-truncate" title={item.productName}>{item.productName}</div>
                                        </td>
                                        <td>
                                            <div class="slds-truncate" title={item.serialNumber}>{item.serialNumber}
                                            </div>
                                        </td>
                                        <td>
                                            <div class="slds-truncate" title={item.warehouse}>{item.warehouse}</div>
                                        </td>
                                        <td>
                                            <div class="slds-truncate" title={item.expiryDate}>
                                                {item.expiryDate}</div>
                                        </td>
                                        <td>
                                            <div class="slds-truncate" title={item.batchNumber}>
                                                {item.batchNumber}</div>
                                        </td>
                                        <td>
                                            <lightning-icon icon-name={item.iconName} size="small" 
                                                variant={item.iconVariant} alternative-text={item.status}>
                                            </lightning-icon>
                                        </td>
                                        <td>
                                            <div class="slds-truncate" title={item.reason}>
                                                {item.reason}</div>
                                        </td>
                                        <td>
                                            <lightning-button-icon icon-name="utility:delete" variant="border-filled"
                                                alternative-text="Remove Item" title="Remove Item"
                                                data-serial={item.serialNumber} onclick={handleRemoveItem}>
                                            </lightning-button-icon>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </div>

            <div class="slds-grid slds-grid_align-end slds-m-top_large">
                <lightning-button label={grnLable} onclick={handleSubmit} variant="brand"
                    disabled={showProcessGRNBtnGetter}></lightning-button>
            </div>
        </div>
    </div>
</template>
