<template>
    <div class="slds-p-around_medium">

        <div class="slds-box slds-theme_warning slds-m-bottom_medium">
            <div class="slds-media">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:warning" alternative-text="Warning" variant="inverse"
                        size="small">
                    </lightning-icon>
                </div>
                <div class="slds-media__body">
                    <p>Are you sure you want to manually close this Purchase Order? <b> This action cannot be undone.</b>
                    </p>
                </div>
            </div>
        </div>

        <lightning-textarea label="Reason for Manual Closure" value={reason} onchange={handleReasonChange} required
            placeholder="Enter a reason...">
        </lightning-textarea>

        <div class="slds-text-align_right slds-m-top_large">
            <lightning-button variant="neutral" label="Cancel" onclick={closeAction} class="slds-m-right_small">
            </lightning-button>

            <lightning-button variant="destructive" label="Close Purchase Order" onclick={handleClosePO}
                disabled={isCloseDisabled}>
            </lightning-button>
        </div>

    </div>
</template>
